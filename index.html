<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua | Digital Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Variables */
        :root {
            --bg-dark: #05080f;
            --bg-card: #0b1221;
            --blue-primary: #3b82f6;
            --blue-hover: #2563eb;
            --blue-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(5, 8, 15, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
        .logo-icon { width: 20px; height: 20px; background: var(--blue-primary); border-radius: 4px; box-shadow: 0 0 15px var(--blue-glow); }

        /* Buttons */
        .btn-primary {
            background: var(--blue-primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--blue-hover); box-shadow: 0 4px 20px var(--blue-glow); transform: translateY(-1px); }
        .btn-primary:active:not(:disabled) { transform: translateY(1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Hero */
        .hero { text-align: center; padding: 5rem 20px 3rem; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -1px; }

        /* Store Grid */
        .store-container { padding: 0 5% 4rem; max-width: 1200px; margin: 0 auto; flex: 1; width: 100%; }
        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 2rem; color: var(--text-muted); font-weight: 500; }
        .section-header::after { content: ""; height: 1px; flex: 1; background: var(--border-color); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; width: 100%; }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover { border-color: var(--blue-primary); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .card-img { width: 100%; height: 160px; background-color: #111827; }
        .card-content { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.2rem; color: #fff; margin-bottom: 0.5rem; }
        .card-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 1.5rem; flex: 1; }
        
        .btn-download {
            width: 100%;
            padding: 0.8rem;
            text-align: center;
            background: rgba(59, 130, 246, 0.1);
            color: var(--blue-primary);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-download:hover { background: var(--blue-primary); color: #fff; }

        /* Empty State */
        .empty-state { grid-column: 1 / -1; background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 12px; padding: 4rem 2rem; text-align: center; }
        .empty-state h3 { color: #fff; margin: 1rem 0 0.5rem; }

        /* Modal Overhaul */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 2rem; width: 90%; max-width: 450px;
            transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.8rem; background: var(--bg-dark); border: 1px solid var(--border-color);
            color: #fff; border-radius: 8px; font-size: 0.9rem; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--blue-primary); }
        
        .file-box {
            border: 2px dashed var(--border-color); padding: 1.5rem; text-align: center;
            border-radius: 8px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02);
        }
        .file-box:hover { border-color: var(--blue-primary); background: rgba(59, 130, 246, 0.05); }
        .file-box span { color: var(--blue-primary); font-weight: 600; }

        /* Custom Toast Notifications */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            background: #fff; color: #000; padding: 12px 20px; border-radius: 8px; font-weight: 500; font-size: 0.9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease forwards, fadeOut 0.3s ease 3s forwards; pointer-events: all;
        }
        .toast.error { background: #ef4444; color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><div class="logo-icon"></div> Aqua</div>
        <button class="btn-primary" id="openUploadBtn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
            Upload Game
        </button>
    </nav>

    <header class="hero">
        <h1>The Vault</h1>
    </header>

    <main class="store-container">
        <div class="section-header">Library</div>
        <div class="grid" id="gameGrid">
            <div class="empty-state" id="emptyState">
                <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3" viewBox="0 0 24 24"><path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <h3>Repository Empty</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Click the upload button to add software.</p>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-size: 1.2rem;">Upload New Title</h2>
                <button class="close-btn" id="closeUploadBtn">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Software Title</label>
                    <input type="text" id="gameTitle" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="gameDesc" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Cover Image URL (Optional)</label>
                    <input type="url" id="gameImage">
                </div>
                <div class="form-group">
                    <label>Upload File</label>
                    <div class="file-box" id="fileBox">
                        <p id="fileNameDisplay">Drag & Drop or <span>Browse</span></p>
                        <input type="file" id="gameFile" accept=".exe,.zip,.rar" style="display: none;" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;" id="submitBtn">Publish to Store</button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- 1. Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // --- 2. LOAD UI ELEMENTS FIRST (Guarantees buttons work) ---
        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openUploadBtn');
        const closeBtn = document.getElementById('closeUploadBtn');
        const fileInput = document.getElementById('gameFile');
        const fileBox = document.getElementById('fileBox');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');

        // Modal triggers
        openBtn.addEventListener('click', () => { modal.classList.add('active'); });
        closeBtn.addEventListener('click', () => { modal.classList.remove('active'); });
        
        // File Selection visual update
        fileBox.addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                fileNameDisplay.innerHTML = `Selected: <span>${e.target.files[0].name}</span>`;
            }
        });

        // Toast Notification System
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerHTML = isError ? `⚠️ ${message}` : `✅ ${message}`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // --- 3. CONNECT DATABASE SAFELY ---
        let supabase;
        try {
            const SUPABASE_URL = 'https://ddejzrmppzddxodgspyi.supabase.co'; 
            const SUPABASE_ANON_KEY = 'sb_publishable_Vtp_NZCF-_zhq3ISSFUZhA_9jNwSha2';
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                throw new Error("Supabase library did not load.");
            }
        } catch (err) {
            console.error("Database connection failed:", err);
            showToast("Warning: Database disconnected. Check your connection or ad-blocker.", true);
        }

        // --- 4. REAL UPLOAD LOGIC ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!supabase) {
                showToast("Cannot upload. The database connection is blocked.", true);
                return;
            }

            const file = fileInput.files[0];
            const title = document.getElementById('gameTitle').value;
            const desc = document.getElementById('gameDesc').value;
            let imgUrl = document.getElementById('gameImage').value || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop';

            submitBtn.textContent = "Uploading to server...";
            submitBtn.disabled = true;

            try {
                showToast("Uploading to secure vault...");
                const uniqueFileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
                
                // Upload to the 'games' bucket
                const { error } = await supabase.storage.from('games').upload(uniqueFileName, file, { cacheControl: '3600' });
                if (error) throw error;

                // Get the direct public URL
                const { data } = supabase.storage.from('games').getPublicUrl(uniqueFileName);
                const downloadLink = data.publicUrl;
                showToast("Upload Live!");

                // Remove Empty State visually
                const emptyState = document.getElementById('emptyState');
                if(emptyState) emptyState.remove();

                // Build the Game Card and add it to the screen
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img" style="background: url('${imgUrl}') center/cover;"></div>
                    <div class="card-content">
                        <h3 class="card-title">${title}</h3>
                        <p class="card-desc">${desc}</p>
                        <a href="${downloadLink}" class="btn-download" target="_blank" download>Download</a>
                    </div>
                `;
                document.getElementById('gameGrid').appendChild(card);

                // Reset Modal
                modal.classList.remove('active');
                form.reset();
                fileNameDisplay.innerHTML = "Drag & Drop or <span>Browse</span>";
                
            } catch (error) {
                console.error(error);
                showToast(error.message, true);
            } finally {
                submitBtn.textContent = "Publish to Store";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
