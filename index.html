<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua | Digital Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Core Variables & Modern Reset */
        :root {
            --bg-dark: #070b14;
            --bg-card: #0d1526;
            --blue-primary: #3b82f6;
            --blue-light: #60a5fa;
            --blue-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(59, 130, 246, 0.2);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at top right, rgba(29, 78, 216, 0.15) 0%, transparent 40%),
                radial-gradient(circle at bottom left, rgba(30, 58, 138, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(7, 11, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: var(--blue-primary);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--blue-glow);
        }

        .nav-actions {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .btn-primary {
            background: var(--blue-primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            background: var(--blue-light);
            box-shadow: 0 0 15px var(--blue-glow);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 20px 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--blue-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Store Container */
        .store-container {
            padding: 2rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--border-color);
        }

        /* Empty State */
        .empty-state {
            background: var(--bg-card);
            border: 1px dashed var(--blue-primary);
            border-radius: 12px;
            padding: 5rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .empty-state h3 { color: var(--text-main); font-size: 1.25rem; margin-bottom: 0.5rem; }

        /* Game Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card-img {
            width: 100%;
            height: 180px;
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card-content { padding: 1.5rem; }
        .card-title { font-size: 1.25rem; color: var(--text-main); margin-bottom: 0.5rem; }
        .card-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
        
        .btn-download {
            display: block;
            width: 100%;
            padding: 10px;
            text-align: center;
            background: var(--bg-dark);
            border: 1px solid var(--blue-primary);
            color: var(--blue-light);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-download:hover {
            background: var(--blue-primary);
            color: #fff;
        }

        /* Upload Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-dark);
            border: 1px solid #333;
            color: var(--text-main);
            border-radius: 6px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--blue-primary);
        }
        .file-upload-box {
            border: 2px dashed #333;
            padding: 2rem;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-upload-box:hover { border-color: var(--blue-primary); }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <div class="logo-icon"></div>
            Aqua
        </div>
        <div class="nav-actions">
            <button class="btn-primary" id="openUploadBtn">+ Upload Software</button>
        </div>
    </nav>

    <header class="hero">
        <h1>The Vault</h1>
    </header>

    <main class="store-container">
        <h2 class="section-title">Library</h2>
        
        <!-- The Grid (Starts Empty) -->
        <div class="grid" id="gameGrid">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">📁</div>
                <h3>Repository Empty</h3>
                <p>Click "Upload Software" to add your first .exe or .zip file.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aqua Platform. All rights reserved.</p>
    </footer>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload New Title</h2>
                <button class="close-btn" id="closeUploadBtn">&times;</button>
            </div>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label>Software Title</label>
                    <input type="text" id="gameTitle" placeholder="e.g., My Awesome Game" required>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="gameDesc" rows="3" placeholder="System requirements, version details..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Cover Image URL (Optional)</label>
                    <input type="url" id="gameImage" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Upload File (.exe, .zip, .rar)</label>
                    <div class="file-upload-box" id="fileBox">
                        <p id="fileNameDisplay">Click to select file...</p>
                        <input type="file" id="gameFile" accept=".exe,.zip,.rar" style="display: none;" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Publish to Store</button>
            </form>
        </div>
    </div>

    <!-- Import Supabase from the official CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // YOUR CUSTOM SUPABASE KEYS
        const SUPABASE_URL = 'https://ddejzrmppzddxodgspyi.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_Vtp_NZCF-_zhq3ISSFUZhA_9jNwSha2';

        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get your form elements
        const modal = document.getElementById('uploadModal');
        const openBtn = document.getElementById('openUploadBtn');
        const closeBtn = document.getElementById('closeUploadBtn');
        const fileBox = document.getElementById('fileBox');
        const fileInput = document.getElementById('gameFile');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const form = document.getElementById('uploadForm');
        const grid = document.getElementById('gameGrid');
        const emptyState = document.getElementById('emptyState');

        // Modal Logic
        openBtn.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));

        // Fake File Input Click
        fileBox.addEventListener('click', () => fileInput.click());
        
        // Show selected file name
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileNameDisplay.textContent = e.target.files[0].name;
                fileNameDisplay.style.color = "var(--blue-light)";
            }
        });

        // THE REAL UPLOAD LOGIC
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first!");

            const title = document.getElementById('gameTitle').value;
            const desc = document.getElementById('gameDesc').value;
            let imgUrl = document.getElementById('gameImage').value || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop';

            // Change button text to show progress
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.textContent = "Uploading to Vault... Please wait.";
            submitBtn.disabled = true;

            try {
                // Upload the file to the 'games' bucket
                const uniqueFileName = Date.now() + '_' + file.name;
                
                const { data, error } = await supabase.storage
                    .from('games')
                    .upload(uniqueFileName, file, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (error) {
                    throw error;
                }

                // Get the real, permanent public download link
                const { data: publicUrlData } = supabase.storage
                    .from('games')
                    .getPublicUrl(uniqueFileName);

                const realDownloadLink = publicUrlData.publicUrl;

                alert("Upload Complete! The game is now live.");

                // Visually add the game to the grid so you can see it immediately
                if (emptyState) emptyState.remove();

                const newCard = document.createElement('div');
                newCard.className = 'card';
                newCard.innerHTML = `
                    <div class="card-img" style="background: url('${imgUrl}') center/cover;"></div>
                    <div class="card-content">
                        <h3 class="card-title">${title}</h3>
                        <p class="card-desc">${desc}</p>
                        <a href="${realDownloadLink}" class="btn-download" target="_blank" download>Download</a>
                    </div>
                `;

                grid.appendChild(newCard);

                // Reset the form
                form.reset();
                fileNameDisplay.textContent = "Click to select file...";
                fileNameDisplay.style.color = "var(--text-muted)";
                submitBtn.textContent = "Publish to Store";
                submitBtn.disabled = false;
                modal.classList.remove('active');

            } catch (error) {
                console.error("Upload failed:", error.message);
                alert("Upload failed: " + error.message);
                submitBtn.textContent = "Publish to Store";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
